<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Martin Poiroux, software engineer, Toulouse">
  <title>Martin Poiroux, software engineer, Toulouse</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#151211"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="1" x2="0"><stop offset="0" stop-color="#c8a96a"/><stop offset="1" stop-color="#c8a96a" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#c8a96a"/><stop offset="1" stop-color="#c8a96a" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    @font-face{font-family:'Cinzel';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Marcellus SC';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Sorts Mill Goudy';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
    .name{font-family:'Cinzel',Georgia,serif;font-weight:600;font-size:66px;letter-spacing:9px;fill:#edebe7;text-anchor:middle;opacity:0;animation:rise 1.2s ease-out .2s forwards}
    .kicker{font-family:'Marcellus SC',Georgia,serif;font-size:17px;letter-spacing:5px;fill:#c8a96a;text-anchor:middle;opacity:0;animation:rise 1s ease-out .9s forwards}
    .sub{font-family:'Sorts Mill Goudy',Georgia,serif;font-style:italic;font-size:25px;fill:#96928a;text-anchor:middle;opacity:0}
    .site{font-family:'Marcellus SC',Georgia,serif;font-size:13px;letter-spacing:4px;fill:#8a857b;text-anchor:middle;opacity:0;animation:rise 1s ease-out 1.6s forwards}
    .rule{transform-box:fill-box;transform:scaleX(0);animation:draw 1.4s cubic-bezier(.2,.7,.2,1) .7s forwards}
    .ruleL{transform-origin:100% 50%} .ruleR{transform-origin:0% 50%}
    .diamond{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:gem 1s ease-out .6s forwards, shine 6s ease-in-out 2s infinite}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{to{transform:scaleX(1)}}
    @keyframes gem{from{opacity:0;transform:rotate(45deg) scale(.2)}to{opacity:1;transform:rotate(45deg) scale(1)}}
    @keyframes shine{0%,100%{fill-opacity:1}50%{fill-opacity:.35}}
    @keyframes cycle{0%{opacity:0;transform:translateY(6px)}3.75%{opacity:1;transform:translateY(0)}21.25%{opacity:1;transform:translateY(0)}25.00%,100%{opacity:0;transform:translateY(-6px)}}.l0{animation:cycle 16s linear 2.0s infinite}.l1{animation:cycle 16s linear 6.0s infinite}.l2{animation:cycle 16s linear 10.0s infinite}.l3{animation:cycle 16s linear 14.0s infinite}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="url(#glow)" stroke="#241f1b"/>
  <rect x="14.5" y="14.5" width="1171" height="271" rx="8" fill="none" stroke="#241f1b" stroke-opacity=".6"/>
  <text class="kicker" x="600.0" y="78">SOFTWARE ENGINEER  ·  TOULOUSE</text>
  <text class="name" x="600.0" y="150">MARTIN POIROUX</text>
  <rect class="rule ruleL" x="280.0" y="178.5" width="300" height="1.5" fill="url(#fadeL)"/>
  <rect class="rule ruleR" x="620.0" y="178.5" width="300" height="1.5" fill="url(#fadeR)"/>
  <rect class="diamond" x="595.0" y="174" width="10" height="10" fill="#c8a96a"/>
  <g>
    <text class="sub l0" x="600.0" y="222">Chess engines since 2019, and the tooling around them.</text>
    <text class="sub l1" x="600.0" y="222">Web applications end to end, from interface to production.</text>
    <text class="sub l2" x="600.0" y="222">C++  ·  C# / .NET  ·  TypeScript  ·  Rust  ·  Python</text>
    <text class="sub l3" x="600.0" y="222">Games, solvers, and the measurements behind them.</text>
  </g>
  <text class="site" x="600.0" y="268">MARTINPOIROUX.COM</text>
</svg>
